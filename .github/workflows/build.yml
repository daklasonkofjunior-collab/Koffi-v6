name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libssl-dev libffi-dev
          pip install buildozer cython==0.29.33

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android debug || true
          ANDROID_SDK=~/.buildozer/android/platform/android-sdk
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOFFI-V6-APK
          path: bin/*.apk
